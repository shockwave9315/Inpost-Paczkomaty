name: Run tests and checks

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --all-extras --dev --locked

      - name: Lint project
        run: uv run ruff check --output-format=github

      - name: Check project formatting
        run: uv run ruff format --check

      # Home Assistant installs integration requirements under its own
      # package_constraints.txt; a conflicting pin makes the integration
      # impossible to load (e.g. python-slugify==8.0.4 vs ==9.1.2).
      - name: Resolve manifest requirements against Home Assistant constraints
        run: |
          constraints="$(uv run python -c 'from importlib import resources; print(resources.files("homeassistant") / "package_constraints.txt")')"
          jq -r '.requirements[]' custom_components/inpost_paczkomaty/manifest.json > manifest-requirements.txt
          uv pip install --dry-run -c "$constraints" -r manifest-requirements.txt


  tests:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      packages: write
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --all-extras --dev --locked

      - name: Run tests
        run: uv run pytest --cov-report "xml:coverage.xml" --cov=custom_components/inpost_paczkomaty --ctrf=report.json tests/

      - name: Pytest coverage comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: MishaKav/pytest-coverage-comment@v1
        with:
          pytest-xml-coverage-path: ./coverage.xml

      - name: Publish Test Report
        uses: ctrf-io/github-test-reporter@v1
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        with:
          report-path: "report.json"
          summary-report: false
          pull-request: true
          annotate: true
          overwrite-comment: true
          pull-request-report: true
          suite-folded-report: false
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # The lock file tracks the newest Home Assistant; this job keeps the minimum
  # version declared in hacs.json honest.
  tests-minimum-ha:
    name: Tests (minimum supported Home Assistant)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install minimum supported Home Assistant
        run: |
          uv venv --python 3.13 .venv-min
          VIRTUAL_ENV=.venv-min uv pip install "homeassistant==2025.1.4" pytest-homeassistant-custom-component "dacite==1.9.2"

      - name: Run tests
        run: .venv-min/bin/python -m pytest tests/
