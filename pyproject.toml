[project]
name = "inpost-paczkomaty"
version = "0.5.0"
readme = "README.md"
requires-python = ">=3.14.2"
# Runtime requirements of the integration. Keep identical to "requirements"
# in custom_components/inpost_paczkomaty/manifest.json (enforced by
# tests/test_manifest.py). Only list packages the integration imports: Home
# Assistant pins its own dependencies, so a redundant pin makes it uninstallable.
dependencies = ["dacite==1.9.2"]

[dependency-groups]
dev = [
    "homeassistant>=2026.10.0",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-homeassistant-custom-component>=0.13.371",
    "pytest-json-ctrf>=0.3.5",
    "ruff>=0.13.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["api"]

[tool.uv]
# old version of uv is somehow transitive dependency of pytest-homeassistant-custom-component
override-dependencies = ["uv; sys_platform == 'never'"]

[tool.ruff]
# The dev environment follows the newest Home Assistant (Python 3.14), but the
# integration source must stay importable on the oldest supported release
# (see hacs.json), which runs Python 3.12.
target-version = "py312"

[tool.ruff.lint]
# Explicit rule set (ruff's historical defaults) so that upgrading ruff does not
# silently change what CI enforces.
select = ["E4", "E7", "E9", "F"]
